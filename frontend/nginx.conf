server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Never let the browser cache the runtime config — it must reflect
    # whatever environment variables this specific container was started with.
    location = /config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files /config.js =404;
    }

    # Standard SPA fallback so client-side routing (if added later) works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Lightweight endpoint for container/orchestrator liveness probes.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
