# Redis: no custom image, no external access - only reachable from other
# pods inside the cluster (ClusterIP), and in practice only the backend
# ever asks for it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: system-pulse
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: system-pulse
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
