# Frontend: the only tier exposed outside the cluster (NodePort). Its Nginx
# config is overridden by a ConfigMap so /api/ calls get quietly forwarded
# to the backend's Service DNS name - the browser never talks to the
# backend directly, mirroring the reverse-proxy setup built for AWS.
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-config
  namespace: system-pulse
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location = /config.js {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            try_files /config.js =404;
        }

        location /api/ {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location = /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: system-pulse
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      enableServiceLinks: false # see backend.yaml for why
      containers:
        - name: frontend
          image: system-pulse-frontend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          env:
            # Empty on purpose: tells the page to call the API on the same
            # origin as itself, which Nginx then proxies to the backend.
            - name: VITE_BACKEND_URL
              value: ""
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: nginx-config
          configMap:
            name: frontend-nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: system-pulse
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
